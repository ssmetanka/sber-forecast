server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # корень → лендинг; лендинг ссылается на ../methodology.md и ../presentation.pdf
    location = / { return 302 /site/; }
    location /site/ { index index.html; }

    location ~ /_draft { deny all; }                      # рабочие черновики не раздаём
    location ~ \.md$ { default_type text/markdown; }      # отчёт открывается в браузере как текст
}
