# Новостной конвейер: источники, правила типов событий, согласование по времени.
collect:
  source: lenta.ru            # открытый дневной архив, только метаданные заголовков
  rubrics: [russia, economics]
  start: "2023-01-01"
  end: "2024-12-31"
  workers: 4
  delay: 0.3

# Типы событий: леммы-триггеры (после лемматизации pymorphy3). Достаточно одной леммы или биграммы.
event_types:
  emergency: [чс, паводок, наводнение, подтопление, подтопить, затопить, затопление, половодье, дамба,
              эвакуация, эвакуировать, землетрясение, ураган, смерч, "лесной пожар", "природный пожар",
              "режим чс", "чрезвычайный ситуация", "чрезвычайный режим"]
  attack: [бпла, беспилотник, дрон, обстрел, обстрелять, "ракетный опасность", "ракетный удар", атака]
  utility: ["отключение свет", "отключение электричество", "отключение вода", "отключение тепло",
            блэкаут, "без свет", "без тепло", "без вода", "коммунальный авария", "прорыв трубопровод"]
  economy: [завод, комбинат, предприятие, банкротство, банкрот, увольнение, сокращение, закрытие,
            "задолженность по зарплата", зарплата, инвестиция, "открытие магазин", маркетплейс, wildberries, ozon]

geocode:
  # слова, совпадающие с названиями МО, но в заголовках почти всегда нарицательные
  stop_names: [мирный, советский, октябрьский, заречный, первомайский, красный, ленинский, кировский,
               центральный, свободный, восточный, северный, южный, западный, новый, береговой, радужный,
               дружный, лесной, полярный, приморский, светлый, солнечный, озёрный, озерный, зеленоградский,
               родина, победа, юбилейный, спутник, снежный, московский, ленинградский, губернатор, россия,
               # города ДНР/ЛНР — омонимы МО Ростовской обл., самих территорий в данных нет (ручной аудит)
               донецк, луганск, макеевка, горловка, енакиево, краснодон]
  region_weight: 0.3          # вклад регионального упоминания в экспозицию каждого МО региона

align:
  half_life_months: 1.0       # затухание экспозиции после месяца события
  max_lag_months: 3
  publication_lag_days: 0     # новость доступна в день публикации (as-of)

hazard:                       # BOCPD: hazard × (1 + beta · min(экспозиция, cap))
  beta: 4.0
  cap: 2.0
  types: [emergency, utility]

official:                     # официальные источники с муниципальной детализацией (шаг 6c)
  acts_start: "2023-01"       # акты о режиме ЧС, publication.pravo.gov.ru
  acts_end: "2024-12"
  mchs_regions: covered       # covered — все регионы, покрытые данными СберИндекса; или список кодов
  mchs_start: "2024-03-25"    # паводковый сезон 2024
  mchs_end: "2024-05-31"
